<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Finder</title>
    <link href="styles/style.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar text-white" style="background-color: #e16120">
      <div class="container-fluid">
        <a href="#" class="navbar-brand d-flex align-items-center">
          <i class="fa-solid fa-utensils fs-3 me-2 text-white"></i>
          <span class="fw-bold"> MEAL FINDER </span>
        </a>

        <!-- RIGHT SIDE : HAMBURGER -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#menu"
          aria-controls="menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <!-- RIGHT SIDE OFFCANVAS MENU -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="menu">
      <!-- MENU HEADER -->
      <div class="offcanvas-header">
        <!-- <h5 class="offcanvas-title">Meal Categories</h5> -->

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>

      <!-- MENU BODY -->
      <div class="offcanvas-body">
        <ul id="categoryMenu" class="list-group">
          <!-- API DATA WILL COME HERE -->
        </ul>
      </div>
    </div>
    <section class="hero">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search recipes here ..."/>
        <button id="searchBtn">&#128269;</button>
      </div>
      <h2>What are your favorite cuisines?</h2>
      <p class="sub-heading">PERSONALIZE YOUR EXPERIENCE</p>
    </section>

    <script src="scripts/script.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
