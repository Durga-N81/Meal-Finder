<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Finder - Category</title>
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header class="navbar">
     <a href="index.html" class="logo">
        <i class="fa-solid fa-utensils"></i>
        <span>MEAL FINDER</span>
      </a>
      <button class="hamburger-btn" id="hamburgerBtn">
        <i class="fa-solid fa-bars"></i>
      </button>
  </header>
  <nav class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeMenuBtn">
        <i class="fa-solid fa-xmark"></i>
      </button>
    <ul id="menuList"></ul>
  </nav>
  <div class="overlay" id="overlay"></div>
  <section class="hero">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search recipes here ..." />
     <button id="searchBtn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
    <h2>What are your favorite cuisines?</h2>
    <p class="sub-heading">PERSONALIZE YOUR EXPERIENCE</p>
  </section>
  <main>
    <section class="category-info" id="categoryInfo">
      <!-- filled by js/category.js -->
    </section>
    <section class="section">
      <h2 class="section-title">Meals</h2>
      <p id="noResultMsg" class="no-result" hidden>No food found</p>
      <div class="grid" id="mealsGrid"></div>
    </section>
  </main>
  <script src="scripts/common.js"></script>
  <script src="scripts/category.js"></script>
  
</body>
</html>
