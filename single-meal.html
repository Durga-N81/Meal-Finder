<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal-finder-Details</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar text-white" style="background-color: #e16120">
      <div class="container-fluid">
        <a href="#" class="navbar-brand d-flex align-items-center">
          <i class="fa-solid fa-utensils fs-3 me-2 text-white"></i>
          <span class="fw-bold"> MEAL FINDER </span>
        </a>

        <!-- RIGHT SIDE : HAMBURGER -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#menu"
          aria-controls="menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <!-- RIGHT SIDE OFFCANVAS MENU -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="menu">
      <!-- MENU HEADER -->
      <div class="offcanvas-header">
        <!-- <h5 class="offcanvas-title">Meal Categories</h5> -->

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>
      <div class="offcanvas-body">
        <ul id="categoryMenu" class="list-group">
          <!-- API DATA WILL COME HERE -->
        </ul>
      </div>
    </div>
    <section class="hero">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search recipes here ..."
        />
        <button id="searchBtn">&#128269;</button>
      </div>
      <h2>What are your favorite cuisines?</h2>
      <p class="sub-heading">PERSONALIZE YOUR EXPERIENCE</p>
    </section>
    <main>
      <div class="breadcrumb">
        <a href="index.html">&#127968;</a> &raquo; <span id="crumbName"></span>
      </div>
      <h2 class="section-title indent">Meal Details</h2>
      <section class="meal-card" id="mealcard">
        <div class="meal-card-topbar">
          <span>🏠 MEAL FINDER</span>
          <span class="menu-dots">&#9776;</span>
        </div>
        <div class="meal-card-body">
          <img id="mealImg" src="" alt="" />

          <div class="meal-info">
            <h2 id="mealTitle"></h2>
            <p><strong>CATEGORY:</strong> <span id="mealCategory"></span></p>
            <p>
              <strong>Source:</strong>
              <a id="mealSource" href="#" target="_blank" rel="noopener"></a>
            </p>

            <div class="tags" id="mealTags"></div>

            <div class="ingredients-box">
              <h3>Ingredients</h3>
              <ol class="ingredients-list" id="ingredientsList"></ol>
            </div>
          </div>
        </div>

        <div class="measures">
          <h3>Measure:</h3>
          <div class="measure-grid" id="measuresGrid"></div>
        </div>

        <div class="instructions">
          <h3>Instructions:</h3>
          <ul id="instructionsList"></ul>
        </div>
      </section>
       <section class="section">
      <h2 class="section-title">Categories</h2>
      <div class="grid" id="categoriesGrid"></div>
    </section>
    </main>
    <script src="scripts/script.js"></script>
  </body>
</html>
